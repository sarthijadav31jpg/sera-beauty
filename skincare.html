
<!DOCTYPE html>
<html>
<head>
    

    <title>SERA BEAUTY - Skincare</title>
      <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/responsive.css">

   <style>
    body {
        background-color: #EEF7FF;
        font-family: Arial, sans-serif;
        text-align: center;
        color: #34495E;
    }

    h1 {
        color: #527DA5;
        margin: 30px;
    }

    .products {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 25px;
        padding: 30px;
    }

    .card {
        background: rgba(255, 255, 255, 0.85);
        padding: 20px;
        border-radius: 18px;
        border: 1px solid #D5E7F5;
        box-shadow: 0 5px 18px rgba(82, 125, 165, 0.10);
        transition: all 0.3s ease;
    }

    .card:hover {
        transform: translateY(-7px);
        box-shadow: 0 12px 28px rgba(82, 125, 165, 0.20);
        border-color: #A7C9E8;
    }

    .card img {
        width: 100%;
        height: 180px;
        object-fit: contain;
    }

    .card h3 {
        color: #527DA5;
    }

    button {
        background: linear-gradient(135deg, #789BBF, #527DA5);
        color: white;
        border: none;
        padding: 10px 18px;
        border-radius: 20px;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    button:hover {
        background: #365B7D;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(82, 125, 165, 0.25);
    }

    .back-home {
        display: inline-block;
        background: #527DA5;
        color: white;
        padding: 10px 20px;
        text-decoration: none;
        border-radius: 20px;
        margin-bottom: 20px;
        transition: all 0.3s ease;
    }

    .back-home:hover {
        background: #365B7D;
        transform: translateY(-2px);
    }

    @media (max-width: 900px) {
        .products {
            grid-template-columns: repeat(2, 1fr);
        }
    }

    @media (max-width: 500px) {
        .products {
            grid-template-columns: 1fr;
        }
    }
</style>
</head>

<body>
<p>🛒 My Cart: <span id="cart-count">0</span></p>
<h1>SERA BEAUTY - Skincare Collection</h1>
<a href="../index.html" class="back-home">← Back to Home</a>
<div class="products">

    <div class="card">
        <img src="../image/facewash.jpg">
        <h3>Face Wash</h3>
        <p>₹299</p>
        <button onclick="addToCart('Face Wash')">
    Add to Cart
</button>
    </div>

    <div class="card">
        <img src="../image/moisturizer.jpg">
        <h3>Moisturizer</h3>
        <p>₹399</p>
        <button onclick="addToCart('moisturizer')">
    Add to Cart
</button>
    </div>

    <div class="card">
        <img src="../image/sunscreen.jpg">
        <h3>Sunscreen</h3>
        <p>₹349</p>
        <button onclick="addToCart('sunscreen')">
    Add to Cart
</button>
    </div>

    <div class="card">
        <img src="../image/faceserum.jpg">
        <h3>Face Serum</h3>
        <p>₹449</p>
        <button onclick="addToCart('faceserum')">
    Add to Cart
</button>
    </div>

    <div class="card">
        <img src="../image/facetoner.jpg">
        <h3>Face Toner</h3>
        <p>₹249</p>
        <button onclick="addToCart('Facetoner')">
    Add to Cart
</button>
    </div>

    <div class="card">
        <img src="../image/facemask.jpg">
        <h3>Face Mask</h3>
        <p>₹299</p>
        <button onclick="addToCart('Facemask')">
    Add to Cart
</button>
    </div>

    <div class="card">
        <img src="../image/lipbalm.jpg">
        <h3>Lip Balm</h3>
        <p>₹149</p>
        <button onclick="addToCart('lipbalm')">
    Add to Cart
</button>
    </div>

    <div class="card">
        <img src="../image/eyecream.jpg">
        <h3>Eye Cream</h3>
        <p>₹299</p>
        <button onclick="addToCart('eyecream')">
    Add to Cart
</button>
    </div>

</div>

<script>
    let cartCount = 0;

    function addToCart(productName) {
        cartCount++;

        alert(productName + " added to your cart successfully! 💗");

        document.getElementById("cart-count").innerText = cartCount;
    }
</script>
</body>

</html>
